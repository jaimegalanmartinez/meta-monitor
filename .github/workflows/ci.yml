name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-13 cmake

      - name: Configure
        run: cmake -S recipes-monitor/system-monitor/files -B build -DCMAKE_CXX_COMPILER=g++-13

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test (binary starts, produces output, survives SIGTERM)
        run: |
          timeout 7 ./build/system-monitor > /tmp/smoke.txt; exit_code=$?
          cat /tmp/smoke.txt
          # exit 124 = killed by timeout (was still running = good)
          # exit 0   = clean shutdown (also good)
          # anything else = crash
          [ "$exit_code" -eq 124 ] || [ "$exit_code" -eq 0 ]
          # must have produced at least one line (sample or warn about missing sysfs)
          test -s /tmp/smoke.txt

  cross-compile-aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: sudo apt-get update && sudo apt-get install -y g++-13-aarch64-linux-gnu cmake

      - name: Configure (aarch64)
        run: |
          cmake -S recipes-monitor/system-monitor/files -B build_arm \
                -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++-13 \
                -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR=aarch64

      - name: Build (aarch64)
        run: cmake --build build_arm --parallel

      - name: Verify binary target architecture
        run: |
          file build_arm/system-monitor | grep -i "aarch64\|ARM aarch64"
